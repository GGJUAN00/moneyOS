name: App de escritorio

# Genera los instaladores de MoneyOS para Windows, macOS y Linux.
# - Al subir una etiqueta vX.Y.Z (por ejemplo v1.0.0) los publica en "Releases".
# - También se puede lanzar a mano desde la pestaña Actions; entonces quedan como
#   "Artifacts" descargables del propio flujo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Crear la versión en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "MoneyOS $TAG" --notes "Instaladores de MoneyOS para escritorio.

          - **Windows**: \`MoneyOS-…-instalador-windows.exe\` (instalador) o \`MoneyOS-…-portable.exe\` (sin instalar).
          - **macOS**: \`MoneyOS-…-mac-arm64.dmg\` (Apple M1/M2/M3/M4) o \`MoneyOS-…-mac-x64.dmg\` (Intel).
          - **Linux**: \`.AppImage\` o \`.deb\`."

  build:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder ${{ matrix.target }} --publish "$PUBLISH"
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyOS-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
