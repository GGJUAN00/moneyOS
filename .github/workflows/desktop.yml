name: App de escritorio

# Genera los instaladores de MoneyOS para Windows, macOS y Linux y los publica en "Releases"
# con la versión de package.json (por ejemplo v1.0.0).
# Se lanza a mano desde la pestaña Actions ("Run workflow") o al subir una etiqueta vX.Y.Z.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear la versión en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $TAG ya existe; se actualizarán sus archivos."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MoneyOS $TAG" --notes "Instaladores de MoneyOS para escritorio.

          - **Windows**: \`MoneyOS-…-instalador-windows.exe\` (instalador) o \`MoneyOS-…-portable.exe\` (sin instalar).
          - **macOS**: \`MoneyOS-…-mac-arm64.dmg\` (Apple M1/M2/M3/M4) o \`MoneyOS-…-mac-x64.dmg\` (Intel).
          - **Linux**: \`.AppImage\` o \`.deb\`."
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyOS-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
