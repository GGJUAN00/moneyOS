<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas que comparten todas las pantallas -->

<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title th:text="${titulo} + ' · MoneyOS'">MoneyOS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/icono.svg}">
    <link rel="apple-touch-icon" th:href="@{/img/icono-180.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/moneyos.css}">
</head>

<!-- Logo: tres barras plateadas -->
<svg th:fragment="logo(tam)" th:width="${tam}" th:height="${tam}" viewBox="0 0 22 22" fill="none" aria-hidden="true">
    <rect x="3" y="13" width="4" height="7" rx="1" fill="#F4F4F5" opacity="0.55"/>
    <rect x="9" y="8" width="4" height="12" rx="1" fill="#F4F4F5" opacity="0.8"/>
    <rect x="15" y="3" width="4" height="17" rx="1" fill="#F4F4F5"/>
</svg>

<!-- Aviso emergente (JOptionPane.showMessageDialog) -->
<div th:fragment="aviso" th:remove="tag">
    <dialog id="aviso" class="ventana" th:if="${aviso != null}"
            th:attr="data-tipo=${aviso.tipo()},data-sonido=${aviso.sonido()}"
            role="alertdialog" aria-labelledby="aviso-titulo">
        <div class="cuerpo">
            <div class="simbolo" th:text="${aviso.tipo() == 'ERROR'} ? '✕' : (${aviso.tipo() == 'ADVERTENCIA'} ? '!' : '✓')">✓</div>
            <div>
                <h2 id="aviso-titulo" th:text="${aviso.titulo()}">Título</h2>
                <p th:text="${aviso.mensaje()}">Mensaje</p>
            </div>
        </div>
        <div class="pie">
            <button type="button" class="boton principal" data-cerrar>Aceptar</button>
        </div>
    </dialog>
</div>

<!-- Confirmación Sí / No (JOptionPane.showConfirmDialog) -->
<dialog th:fragment="confirmar" id="confirmar" class="ventana" data-tipo="ADVERTENCIA" role="alertdialog">
    <div class="cuerpo">
        <div class="simbolo">?</div>
        <div>
            <h2>Confirmar</h2>
            <p>¿Está seguro?</p>
        </div>
    </div>
    <div class="pie">
        <button type="button" class="boton" data-cerrar>No</button>
        <button type="button" class="boton principal" data-si>Sí</button>
    </div>
</dialog>

<!-- Iconos de las pestañas -->
<th:block th:fragment="icono(nombre)" th:switch="${nombre}">
    <svg th:case="'inicio'" viewBox="0 0 22 22" fill="none"><path d="M3 9.5L11 2.5L19 9.5V19.5a1 1 0 0 1-1 1h-4v-6H8v6H4a1 1 0 0 1-1-1V9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <svg th:case="'lista'" viewBox="0 0 22 22" fill="none"><path d="M8 6h11M8 11h11M8 16h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="4" cy="11" r="1.4" fill="currentColor"/><circle cx="4" cy="16" r="1.4" fill="currentColor"/></svg>
    <svg th:case="'mas'" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M11 7v8M7 11h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <svg th:case="'graficas'" viewBox="0 0 22 22" fill="none"><rect x="3" y="13" width="4" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="8" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="15" y="3" width="4" height="17" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>
    <svg th:case="'usuarios'" viewBox="0 0 22 22" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 18c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.5" cy="7" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M15 12.2c2.3 0 4 1.3 4.6 3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg th:case="*" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="7.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4 19c1-3.6 3.8-5.4 7-5.4s6 1.8 7 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
</th:block>

</html>
