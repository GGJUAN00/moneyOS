# ===== MoneyOS =====
spring.application.name=MoneyOS
# Render indica el puerto en la variable PORT; en el computador se usa 8080
server.port=${PORT:8080}
server.servlet.session.timeout=60m
server.error.whitelabel.enabled=false

# Base de datos local en archivo (carpeta ./datos). En Render se usa PostgreSQL (DATABASE_URL).
spring.datasource.url=jdbc:h2:file:./datos/moneyos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Usuarios de prueba de la guía (admin, operador y consulta con clave 1234)
moneyos.datos-demo=true
# Administrador inicial
moneyos.admin.usuario=${ADMIN_USUARIO:admin}
moneyos.admin.clave=${ADMIN_CLAVE:1234}
moneyos.admin.nombre=${ADMIN_NOMBRE:Carlos Mendoza}
